name: Build and deploy harbor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
      - name: Stage only the public game and player guide
        run: |
          mkdir -p site
          cp index.html PLAYER.md site/
          mkdir -p site/claw/assets
          cp claw/index.html claw/ui.mjs claw/style.css claw/core.mjs site/claw/
          cp claw/assets/plush.png site/claw/assets/
          mkdir -p site/door
          cp door/index.html door/core.mjs door/game.mjs door/PLAYER.md site/door/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
